# Builds the web app and publishes it to GitHub Pages (https://<owner>.github.io/lan/).
# The data lives in the sibling repository `lan-data`, served from the same origin at /lan-data/.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc -b && npx vite build
        env:
          LAN_BASE: /lan/
          VITE_DATA_BASE: /lan-data
          VITE_US_DATA_BASE: https://pub-4a01450758144017a0f1b09a528748df.r2.dev/us
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
