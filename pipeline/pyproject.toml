[project]
name = "lan"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Nazar Polishchuk", email = "polishuknazar37@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "earthaccess>=0.19.0",
    "geopandas>=1.2.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pytz>=2026.6",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
